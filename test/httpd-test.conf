ServerRoot "@ROOT@"
DefaultRuntimeDir "@ROOT@/run"
PidFile "@ROOT@/run/httpd.pid"
ServerName localhost
Listen 8080
ErrorLog "@ROOT@/logs/error.log"
LogLevel info prefixlimit:info
DocumentRoot "@ROOT@/htdocs"

LoadModule mpm_event_module /usr/lib/apache2/modules/mod_mpm_event.so
LoadModule authz_core_module /usr/lib/apache2/modules/mod_authz_core.so
LoadModule remoteip_module /usr/lib/apache2/modules/mod_remoteip.so
LoadModule headers_module /usr/lib/apache2/modules/mod_headers.so
LoadModule prefixlimit_module @SRC@/.libs/mod_prefixlimit.so

StartServers 3
ThreadsPerChild 5
ServerLimit 3
MaxRequestWorkers 15
MinSpareThreads 5
MaxSpareThreads 15

RemoteIPHeader X-Forwarded-For
RemoteIPInternalProxy 127.0.0.1 ::1

PrefixListFile "@ROOT@/prefixes-test.yaml"

<Directory "@ROOT@/htdocs">
    Require all granted
</Directory>

Header always set X-Class "%{PREFIX_CLASS}e" env=PREFIX_CLASS

<Location /limited/>
    PrefixRateLimit testcls 2/s burst=2
    PrefixRateLimit aicrawler 1/m burst=1
</Location>
